# Add as a NEW site to host Nginx (Ubuntu). Keep existing sites enabled.
# Certbot --nginx adds HTTPS and HTTP -> HTTPS redirection after DNS resolves.
# Keep query strings out of logs: Google sends code/state in callback queries.
log_format solarsync_api '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name api-solarsync.marshelportfolio.me;
    access_log /var/log/nginx/solarsync-api-access.log solarsync_api;
    error_log /var/log/nginx/solarsync-api-error.log warn;

    client_max_body_size 12m;
    client_body_timeout 20s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_cache off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # No per-peer IP quota here: requests arrive via Vercel's shared proxies.
    # Redis applies the existing account/global quotas. Apply per-user-IP rules
    # at Vercel's ingress if needed; never trust arbitrary forwarded-IP headers.
    location = /health/ready {
        proxy_pass http://127.0.0.1:18000;
    }
    location = /api/v1/auth/google/callback {
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:18000;
    }
    location /api/v1/auth/ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18000;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:18000;
    }
    location / { return 404; }
}
