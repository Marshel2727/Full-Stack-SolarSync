x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Login counters are security state, not disposable response cache entries.
  solarsync-auth-store:
    logging: *logging
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - solarsync_auth_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  solarsync-cache:
    logging: *logging
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  solarsync-db:
    logging: *logging
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: solarsync
      MYSQL_USER: solarsync_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Isi MYSQL_PASSWORD di .env root proyek}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Isi MYSQL_ROOT_PASSWORD di .env root proyek}
    volumes:
      - solarsync_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  solarsync-backend:
    logging: *logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: SolarSync API
      UPLOAD_DIR: /app/private_uploads
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      REDIS_URL: redis://solarsync-cache:6379/0
      AUTH_REDIS_URL: redis://solarsync-auth-store:6379/0
      LOGIN_ACCOUNT_LIMIT: ${LOGIN_ACCOUNT_LIMIT:-10}
      LOGIN_ACCOUNT_WINDOW_SECONDS: ${LOGIN_ACCOUNT_WINDOW_SECONDS:-900}
      LOGIN_GLOBAL_LIMIT: ${LOGIN_GLOBAL_LIMIT:-120}
      SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-28800}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/v1/auth/google/callback}
      DB_HOST: solarsync-db
      DB_PORT: "3306"
      DB_NAME: solarsync
      DB_USER: solarsync_app
      DB_PASSWORD: ${MYSQL_PASSWORD:?Isi MYSQL_PASSWORD di .env root proyek}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - solarsync_uploads:/app/private_uploads
    depends_on:
      solarsync-db:
        condition: service_healthy
      solarsync-auth-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).close()"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  solarsync-frontend:
    logging: *logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ENABLE_ROLE_DEMO: ${NEXT_PUBLIC_ENABLE_ROLE_DEMO:-false}
    container_name: solarsync-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://solarsync-backend:8000
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_ENABLE_ROLE_DEMO=${NEXT_PUBLIC_ENABLE_ROLE_DEMO:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all(['/login','/api/v1/auth/google/config'].map(p=>fetch('http://127.0.0.1:3000'+p))).then(rs=>{if(rs.some(r=>!r.ok))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 25s
    depends_on:
      solarsync-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  solarsync_uploads:
  solarsync_mysql_data:
  solarsync_auth_data:
